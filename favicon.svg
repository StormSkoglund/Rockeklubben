<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="Rockeklubben favicon">
  <defs>
    <linearGradient id="pickGrad" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ff3b30" />
      <stop offset="1" stop-color="#ff8a00" />
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- dark rounded background for contrast -->
  <rect width="64" height="64" rx="12" fill="#0b0b0b" />

  <!-- bold guitar-pick badge -->
  <path d="M32 10 C24 10 16 16 16 26 C16 36 24 50 32 54 C40 50 48 36 48 26 C48 16 40 10 32 10 Z"
        fill="url(#pickGrad)" filter="url(#shadow)" />

  <!-- high-contrast lightning bolt centered inside pick -->
  <path d="M34 16 L24 34 L32 34 L28 48 L42 26 L34 26 Z"
        fill="#ffffff" stroke="#000000" stroke-opacity="0.12" stroke-width="0.5"/>

  <!-- small accent star to add rock flair -->
  <g transform="translate(44,12) scale(0.9)">
    <polygon points="2,0 2.6,1.6 4.6,1.6 3.1,2.6 3.8,4.2 2,3.1 0.2,4.2 0.9,2.6 -0.6,1.6 1.4,1.6"
             fill="#ffffff" opacity="0.92" />
  </g>
</svg>